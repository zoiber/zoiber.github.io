<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="t d">
  <title id="t">Modelo operativo habilitado por IA: tres niveles sobre una base transversal</title>
  <desc id="d">Tres niveles apilados: IA para las personas, IA para los procesos e IA en el núcleo del negocio, sobre una base transversal de datos, integración, seguridad, gobierno, evaluación, gestión del conocimiento y gestión del cambio.</desc>
  <style>
    text { font-family: "Segoe UI", Helvetica, Arial, sans-serif; }
    .h { font-size: 30px; font-weight: 700; }
    .s { font-size: 22px; }
    .tag { font-size: 20px; font-weight: 700; letter-spacing: 1px; }
  </style>
  <rect width="1400" height="820" fill="#ffffff"/>
  <text x="700" y="62" text-anchor="middle" font-size="34" font-weight="700" fill="#111827" style="font-family:'Segoe UI',Helvetica,Arial,sans-serif">Modelo operativo habilitado por IA</text>

  <!-- Nivel 3 -->
  <rect x="120" y="105" width="1160" height="150" rx="18" fill="#92400e"/>
  <text x="160" y="150" class="tag" fill="#fde68a">NIVEL 3</text>
  <text x="160" y="195" class="h" fill="#ffffff">IA en el núcleo del negocio</text>
  <text x="160" y="233" class="s" fill="#fef3c7">Predicción · anomalías · optimización · percepción · personalización</text>

  <!-- Nivel 2 -->
  <rect x="120" y="275" width="1160" height="150" rx="18" fill="#d97706"/>
  <text x="160" y="320" class="tag" fill="#fffbeb">NIVEL 2</text>
  <text x="160" y="365" class="h" fill="#ffffff">IA para los procesos</text>
  <text x="160" y="403" class="s" fill="#fffbeb">De copiloto a agente supervisado, con revisión humana que se guarda como aprendizaje</text>

  <!-- Nivel 1 -->
  <rect x="120" y="445" width="1160" height="150" rx="18" fill="#fbbf24"/>
  <text x="160" y="490" class="tag" fill="#78350f">NIVEL 1</text>
  <text x="160" y="535" class="h" fill="#1f2937">IA para las personas</text>
  <text x="160" y="573" class="s" fill="#374151">Productividad, búsqueda y síntesis, análisis y asistentes por rol</text>

  <!-- Base -->
  <rect x="120" y="625" width="1160" height="150" rx="18" fill="#1f2937"/>
  <text x="160" y="670" class="tag" fill="#fbbf24">BASE TRANSVERSAL</text>
  <text x="160" y="715" class="h" fill="#ffffff">Datos · integración · seguridad · gobierno</text>
  <text x="160" y="753" class="s" fill="#e5e7eb">Evaluación · gestión del conocimiento · gestión del cambio</text>

  <!-- flecha de dependencia -->
  <g fill="#9ca3af">
    <path d="M70 775 L70 120 L50 145 M70 120 L90 145" stroke="#9ca3af" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
